# _config.yml Schema
# Configuration contract for Jekyll site with Minimal Mistakes theme
# This schema defines the required and optional configuration for the Jekyll website

# ============================================================================
# SITE SETTINGS (Required)
# ============================================================================
title: "Festina Lente"
  # Type: String (required)
  # Description: Main site title displayed in header and browser tabs
  # Validation: 1-100 characters

subtitle: "Software Development Projects"
  # Type: String (optional but recommended)
  # Description: Tagline or subtitle for the site
  # Validation: 1-100 characters

name: "Festina Lente"
  # Type: String (required)
  # Description: Site/organization name (used in footer, copyright)

description: >-
  Portfolio of open-source projects by Festina Lente, including developer tools,
  code standards, and utilities for software development teams.
  # Type: String (required)
  # Description: Site description for SEO and social media
  # Validation: 150-300 characters recommended

url: "https://www.festina-lente.io"
  # Type: String (required)
  # Description: Full site URL (must match CNAME file)
  # Validation: Must be HTTPS URL, no trailing slash
  # IMPORTANT: This must match the custom domain configured in GitHub Pages

baseurl: ""
  # Type: String (optional)
  # Description: Subpath for site (empty for root deployment)
  # Validation: No trailing slash if specified
  # For GitHub Pages user site, this should be empty

repository: "festina-lente-io/web"
  # Type: String (optional but recommended)
  # Description: GitHub repository in format owner/repo
  # Used by github-metadata plugin

# ============================================================================
# THEME CONFIGURATION (Required)
# ============================================================================
remote_theme: "mmistakes/minimal-mistakes"
  # Type: String (required)
  # Description: Remote theme to use (Minimal Mistakes)
  # Validation: Must be valid GitHub repository in format owner/repo
  # DO NOT specify version tag to always use latest

minimal_mistakes_skin: "contrast"
  # Type: String (required)
  # Description: Minimal Mistakes color scheme
  # Validation: Must be one of: default, air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
  # Requirement: FR-002 specifies "contrast" skin

# ============================================================================
# AUTHOR / SITE OWNER (Optional)
# ============================================================================
author:
  name: "Festina Lente"
    # Type: String
    # Description: Author/organization name
  
  avatar: "/assets/images/avatar.jpg"
    # Type: String (optional)
    # Description: Path to avatar image
    # Validation: Relative path or full URL
  
  bio: "Open-source software development projects and tools"
    # Type: String (optional)
    # Description: Short bio displayed in sidebar
  
  location: ""
    # Type: String (optional)
    # Description: Geographic location
  
  links:
    # Type: Array (optional)
    # Description: Social media and website links
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/festina-lente-io"

# ============================================================================
# SITE FOOTER (Optional)
# ============================================================================
footer:
  links:
    # Type: Array (optional)
    # Description: Links displayed in site footer
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/festina-lente-io"

# ============================================================================
# COLLECTIONS (Required)
# ============================================================================
collections:
  projects:
    output: true
      # Type: Boolean (required)
      # Description: Generate HTML pages for each collection item
      # Requirement: FR-019 mandates output enabled for projects
    
    permalink: /projects/:name/
      # Type: String (required)
      # Description: URL pattern for project pages
      # Variables: :collection, :name, :path, :title
      # Validation: Must start with /

# ============================================================================
# DEFAULTS (Front Matter Defaults)
# ============================================================================
defaults:
  # Scope: All files
  - scope:
      path: ""
    values:
      layout: "default"
      author_profile: false

  # Scope: Project collection items
  - scope:
      path: ""
      type: projects
    values:
      layout: "single"
        # Use single post layout for project pages
      author_profile: false
        # Don't show author sidebar on project pages
      share: true
        # Enable social sharing buttons
      related: false
        # Don't show related posts
      read_time: true
        # Show estimated reading time
      comments: false
        # Disable comments (static site)
      toc: true
        # Enable table of contents for long quickstart guides
      toc_sticky: true
        # Make TOC sticky during scroll

  # Scope: Pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: "single"
      author_profile: false

# ============================================================================
# PLUGINS (Required)
# ============================================================================
plugins:
  # Type: Array (required)
  # Description: Jekyll plugins (must be GitHub Pages-compatible)
  # Research: See research.md section 2 for rationale
  - jekyll-feed
    # RSS/Atom feed generation
  - jekyll-seo-tag
    # SEO meta tags and structured data
  - jekyll-sitemap
    # XML sitemap generation
  - jekyll-include-cache
    # Performance optimization (caches includes)
  - jekyll-paginate
    # Pagination support (if needed for blog)
  - jekyll-gist
    # Embed GitHub gists

# ============================================================================
# PLUGIN CONFIGURATION
# ============================================================================

# SEO Tag Plugin
twitter:
  username: ""
    # Type: String (optional)
    # Twitter username for Twitter Cards

social:
  type: "Organization"
    # Type: String (optional)
    # Schema.org type: Person or Organization
  name: "Festina Lente"
    # Type: String (optional)
    # Name for structured data
  links:
    # Type: Array (optional)
    # Social profile URLs for structured data
    - "https://github.com/festina-lente-io"

# Feed Plugin
atom_feed:
  path: feed.xml
    # Type: String (optional)
    # Path for RSS/Atom feed

# ============================================================================
# BUILD SETTINGS (Required)
# ============================================================================
markdown: kramdown
  # Type: String (required)
  # Description: Markdown processor
  # Validation: Must be "kramdown" for GitHub Pages

kramdown:
  input: GFM
    # GitHub Flavored Markdown
  auto_ids: true
    # Generate heading IDs automatically
  hard_wrap: false
    # Don't convert newlines to <br>
  syntax_highlighter: rouge
    # Code syntax highlighter

# ============================================================================
# CONTENT SETTINGS
# ============================================================================
timezone: America/New_York
  # Type: String (optional)
  # Description: Site timezone for date/time display
  # Validation: Must be valid TZ database name

encoding: "utf-8"
  # Type: String (required)
  # Description: File encoding

locale: "en-US"
  # Type: String (optional)
  # Description: Site locale for i18n

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================
permalink: /:categories/:title/
  # Type: String (optional)
  # Description: Default permalink structure for posts
  # Not critical for MVP (no blog posts)

paginate: 10
  # Type: Integer (optional)
  # Description: Posts per page (if pagination enabled)

paginate_path: /page:num/
  # Type: String (optional)
  # Description: Pagination URL pattern

# ============================================================================
# SASS/CSS SETTINGS (Optional)
# ============================================================================
sass:
  sass_dir: _sass
  style: compressed
    # Minify CSS for production

# ============================================================================
# EXCLUDED FILES (Optional but Recommended)
# ============================================================================
exclude:
  # Type: Array (optional)
  # Description: Files/directories to exclude from build
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md
  - LICENSE
  - specs/
    # Exclude specification documents from built site

# ============================================================================
# INCLUDED FILES (Optional)
# ============================================================================
include:
  # Type: Array (optional)
  # Description: Files to include in build (overrides default exclusions)
  - .htaccess
  - _pages

# ============================================================================
# KEEP FILES (Optional)
# ============================================================================
keep_files:
  # Type: Array (optional)
  # Description: Files to keep in destination directory
  - .git
  - .svn

# ============================================================================
# VALIDATION RULES
# ============================================================================
# 1. url must match CNAME file content (www.festina-lente.io)
# 2. minimal_mistakes_skin must be "contrast" (FR-002)
# 3. collections.projects.output must be true (FR-019)
# 4. All plugins must be GitHub Pages-compatible
# 5. remote_theme must be mmistakes/minimal-mistakes
# 6. markdown must be kramdown
# 7. All required fields must be present
# 8. Inline comments should explain all non-obvious settings (Constitution II)
