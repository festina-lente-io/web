# navigation.yml Schema
# Navigation configuration contract for Jekyll site
# Location: _data/navigation.yml

# ============================================================================
# MAIN NAVIGATION (Required)
# ============================================================================
main:
  # Type: Array (required)
  # Description: Main site navigation menu items
  # Displayed in header/top navigation bar
  # Validation: At least one item required

  - title: "Home"
    # Type: String (required)
    # Description: Display text for navigation link
    # Validation: 1-30 characters, no special formatting needed
    # Example: "Home", "Projects", "About"
    
    url: "/"
    # Type: String (required)
    # Description: Target URL for navigation link
    # Validation: Must be valid URL or relative path
    # - Internal: "/", "/projects/project-name/", "/about/"
    # - External: "https://example.com"
    # Note: External links should be avoided in main navigation
    
    description: "Return to homepage"
    # Type: String (optional)
    # Description: Tooltip text or ARIA description for accessibility
    # Validation: 1-100 characters

  - title: "DevToys MCP"
    url: "/projects/devtoys-mcp/"
    description: "Model Context Protocol server for development tools"

  - title: "Code Standards"
    url: "/projects/code-standards/"
    description: "Code quality standards and best practices"

# ============================================================================
# ADDITIONAL NAVIGATION MENUS (Optional)
# ============================================================================
# Minimal Mistakes supports multiple navigation menus
# Can be used for sidebar navigation, footer links, etc.

docs:
  # Type: Array (optional)
  # Description: Documentation-specific navigation (if needed)
  # Example use case: Sidebar navigation for documentation pages
  
  - title: "Getting Started"
    children:
      # Type: Array (optional)
      # Description: Nested navigation items (creates dropdown/sidebar sections)
      
      - title: "Quick Start"
        url: /docs/quick-start/
      
      - title: "Installation"
        url: /docs/installation/

# ============================================================================
# STRUCTURE RULES
# ============================================================================
# 1. Main navigation items appear in header
# 2. Order in YAML determines display order (top to bottom = left to right in header)
# 3. URLs must point to existing pages (will break if 404)
# 4. Title must be unique within same navigation menu
# 5. External URLs should use full HTTPS URLs
# 6. Internal URLs should be relative paths starting with /

# ============================================================================
# ACCESSIBILITY REQUIREMENTS
# ============================================================================
# 1. All items should have descriptive titles
# 2. Description field provides additional context for screen readers
# 3. Navigation order should be logical (Home first, then main sections)
# 4. Avoid generic labels like "Click Here" or "Link"

# ============================================================================
# MAINTENANCE GUIDELINES
# ============================================================================
# Adding a new project:
# 1. Create project file in _projects/
# 2. Add navigation item to main array
# 3. Use consistent title format with existing projects
# 4. URL must match project permalink pattern

# Removing a project:
# 1. Remove navigation item from main array
# 2. Remove or archive project file from _projects/
# 3. Check for broken links elsewhere on site

# ============================================================================
# VALIDATION CHECKLIST
# ============================================================================
# [ ] At least one main navigation item exists
# [ ] All URLs are valid and point to existing pages
# [ ] Titles are unique within each navigation menu
# [ ] No trailing slashes for external URLs
# [ ] Internal URLs start with /
# [ ] Description provided for accessibility (recommended)
# [ ] Navigation order is logical

