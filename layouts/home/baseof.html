<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="{{ .Site.Language.LanguageDirection | default `ltr` }}">
  {{- partial "head.html" . -}}
  <body>
    <div class='hx:mx-auto hx:flex hextra-max-page-width hx:justify-center'>
      <div class="hx:w-full hx:break-words hx:min-h-screen hx:min-w-0 hx:pb-8 hx:pt-8 hx:md:pt-12 hx:pl-[max(env(safe-area-inset-left),1.5rem)] hx:pr-[max(env(safe-area-inset-left),1.5rem)]">
        <div class="hx:flex hx:flex-col hx:items-center hx:text-center">
          {{ .Content }}
        </div>
      </div>
    </div>
    {{- if or (eq .Site.Params.footer.enable nil) (.Site.Params.footer.enable) }}
      {{ partial "footer.html" . }}
    {{ end }}
    {{ partial "scripts.html" . }}
  </body>
</html>
